<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Bazar | Aide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <main class="container error-page">
        <p class="error-page__code">?</p>
        <h1>Besoin d'aide ?</h1>
        <p>Signalez un problème ou envoyez-nous votre question.</p>
        <a class="button button--primary" href="index.html">Retour à l'accueil</a>
        <form class="error-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="9e9527f7-ec69-4c06-81f8-3166717593e1">
            <input type="hidden" name="subject" value="Nouveau message Movies Bazar">
            <input type="hidden" name="from_name" value="Movies Bazar">
            <h2>Signaler un problème</h2>
            <p>Envoyez-nous vos coordonnées et nous vous répondrons rapidement.</p>
            <div class="form-row"><label for="contact-name">Votre nom</label><input id="contact-name" name="name" type="text" required autocomplete="name" placeholder="Votre nom"></div>
            <div class="form-row"><label for="contact-email">Votre email</label><input id="contact-email" name="email" type="email" required autocomplete="email" placeholder="vous@exemple.fr"></div>
            <div class="form-row"><label for="contact-phone">Votre téléphone</label><input id="contact-phone" name="phone" type="tel" required placeholder="+33 6 00 00 00 00"></div>
            <div class="form-row"><label for="contact-message">Votre message</label><textarea id="contact-message" name="message" required placeholder="Décrivez votre problème"></textarea></div>
            <button class="button button--outline" type="submit">Envoyer le signalement</button>
        </form>
    </main>
    <script src="js/app.js?v=404-nav"></script>
</body>
</html>
