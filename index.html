<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Movies Bazar - Découvrez les films qui font vibrer le village.">
    <title>Movies Bazar | Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>
    <main>
        <section class="hero container" aria-labelledby="hero-title">
            <div class="hero__copy">
                <p class="eyebrow">Votre cinéma, autrement</p>
                <h1 id="hero-title">Trouvez vos <span>films</span><br>et séries préférés</h1>
                <p class="hero__text">Les histoires qui font vibrer la salle sont ici. Explorez les sorties, les classiques et les pépites à découvrir.</p>
                <a class="button button--primary" href="search.html">Explorer les films <span aria-hidden="true">→</span></a>
            </div>
            <div class="hero__art" aria-label="Affiches de films populaires">
                <div class="hero__glow"></div>
                <img class="hero__poster hero__poster--back" src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" alt="Affiche de Dune: Part Two">
                <img class="hero__poster hero__poster--front" src="https://m.media-amazon.com/images/M/MV5BNWE5MGI3MDctMmU5Ni00YzI2LWEzMTQtZGIyZDA5MzQzNDBhXkEyXkFqcGc@._V1_QL75_UX380_CR0,1,380,562_.jpg" alt="Affiche des Gardiens de la Galaxie">
                <span class="hero__play" aria-hidden="true">▶</span>
            </div>
        </section>
        <section class="container section" aria-labelledby="trending-title">
            <div class="section-heading"><div><p class="eyebrow">À ne pas manquer</p><h2 id="trending-title">Movies</h2></div><a href="tendance.html">Voir tout <span aria-hidden="true">→</span></a></div>
            <div id="trending-grid" class="movie-grid movie-grid--home"></div>
            <button id="load-more-home" class="button button--outline load-more" type="button">Charger plus de films 2024</button>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js?v=404-nav"></script>
    <script src="js/home.js"></script>
</body>
</html>
